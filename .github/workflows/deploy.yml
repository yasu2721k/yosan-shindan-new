name: Deploy to archist.jp

# main への push で自動デプロイ。手動実行もできる（Actions タブ → Run workflow）
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-archist
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # シークレットは run: に直接展開せず env 経由で渡す
      - name: SSH鍵を設定
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
        run: |
          mkdir -p ~/.ssh

          # XSERVER_SSH_KEY は base64（1行）でも生の秘密鍵でも受け付ける。
          # GitHubのSecret欄に貼ると改行が失われることがあるため base64 を推奨。
          if printf '%s' "$SSH_KEY" | tr -d '\r\n' | base64 -d 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "入力形式: base64"
            printf '%s' "$SSH_KEY" | tr -d '\r\n' | base64 -d > ~/.ssh/id_deploy
          else
            echo "入力形式: 生のPEM"
            printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          fi
          if [ -n "$(tail -c1 ~/.ssh/id_deploy)" ]; then echo >> ~/.ssh/id_deploy; fi
          chmod 600 ~/.ssh/id_deploy

          # 鍵の中身は出さず、形だけ検査する（ヘッダ/フッタ行は秘密情報ではない）
          echo "行数: $(wc -l < ~/.ssh/id_deploy)"
          echo "先頭: $(head -n1 ~/.ssh/id_deploy)"
          echo "末尾: $(tail -n1 ~/.ssh/id_deploy)"
          if ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "鍵の形式: OK"
          else
            echo "::error::XSERVER_SSH_KEY が正しい秘密鍵として読めません。GitHubのSecretに貼り直してください"
            exit 1
          fi

          ssh-keyscan -p 10022 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync で配信ディレクトリへ同期
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_NAME: ${{ secrets.XSERVER_USER }}
          DEST_PATH: ${{ secrets.XSERVER_PATH }}
        run: |
          rsync -rlvz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p 10022" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            --exclude '参考サイト/' \
            --exclude 'screenshot-*.png' \
            --exclude '*.md' \
            ./ \
            "$USER_NAME@$HOST:$DEST_PATH"

      - name: 公開URLの疎通を確認
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L https://archist.jp/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::https://archist.jp/ が200を返しませんでした"
          exit 1
